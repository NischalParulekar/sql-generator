[project]
name = "tableqa"
version = "0.1.0"
description = "Benchmarking rule-based, TAPAS and LLM-agent systems for table question answering"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb==2.0.0",
]

[project.optional-dependencies]
service = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pydantic==2.9.2",
    "redis==8.1.0",
    "prometheus-client==0.26.0",
    "python-multipart==0.0.34",
]

agent = [
    "anthropic==2.8.0",
    "python-dotenv==1.2.4",
]
tapas = [
    "torch==2.15.0",
    "transformers==5.23.0",
    "pandas==3.1.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "fakeredis[lua]==2.40.0",
    "httpx==0.28.1",
]

# CPU-only PyTorch on every platform: the default Linux wheel pulls in gigabytes of CUDA.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tableqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters with calls in argument defaults.
extend-immutable-calls = ["fastapi.File"]
