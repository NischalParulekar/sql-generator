[project]
name = "tableqa"
version = "0.1.0"
description = "Benchmarking rule-based, TAPAS and LLM-agent systems for table question answering"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb==2.0.0",
]

[project.optional-dependencies]
service = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pydantic==2.9.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tableqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
