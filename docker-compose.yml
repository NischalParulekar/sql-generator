# Local stack: the API, Redis, Prometheus and Grafana. Every port is bound to this
# machine only. The Anthropic key, if any, comes from the git-ignored .env file.
services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      TABLEQA_SYSTEMS: rule_based,agent_haiku
      DAILY_SPEND_CAP_USD: "0.50"
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    env_file:
      - path: .env
        required: false
    depends_on: [redis]
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    # noeviction: evicting keys could reset the daily spend counter or rate limits.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tableqa.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]
