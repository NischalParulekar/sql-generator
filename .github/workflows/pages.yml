# Publishes the UI to GitHub Pages. With no API_URL repository variable it builds the
# recorded demo, which replays frontend/public/demo.json and needs no server or key.
# Set the repository variable API_URL to a deployed API's address (for example the
# Render service from render.yaml) and it builds the live UI instead.
name: Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the UI (recorded unless API_URL is set)
        working-directory: frontend
        env:
          VITE_RECORDED: ${{ vars.API_URL == '' && '1' || '0' }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
