name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Python 3.11, the locked dependencies and the service extra
        run: uv sync --locked --extra service
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
